<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Sistema Bancario | INACAP
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        :root {
            --inacap-red: #e2231a;
            --inacap-red-dark: #bf1b14;
            --inacap-dark: #1f1f1f;
            --inacap-dark-soft: #2b2b2b;
            --inacap-gray: #f3f4f6;
            --inacap-gray-2: #e5e7eb;
            --inacap-text: #272727;
            --inacap-muted: #6b7280;
            --inacap-white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--inacap-gray);
            color: var(--inacap-text);
            font-family: Arial, Helvetica, sans-serif;
        }

        /* -------------------------
           NAVBAR
        ------------------------- */

        .navbar {
            background-color: var(--inacap-dark) !important;
            border-bottom: 5px solid var(--inacap-red);
            padding-top: 14px;
            padding-bottom: 14px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        .navbar-brand {
            color: var(--inacap-white) !important;
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 0.2px;
        }

        .navbar-brand:hover {
            color: var(--inacap-white) !important;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* -------------------------
           CONTENEDOR PRINCIPAL
        ------------------------- */

        .main-container {
            margin-top: 45px;
            margin-bottom: 60px;
        }

        /* -------------------------
           TITULOS
        ------------------------- */

        h1,
        h2,
        h3,
        h4,
        h5 {
            color: var(--inacap-dark);
        }

        .page-title {
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            color: var(--inacap-muted);
        }

        /* -------------------------
           TARJETAS
        ------------------------- */

        .card {
            background-color: var(--inacap-white);
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .dashboard-card {
            border-top: 5px solid var(--inacap-red);
        }

        .dashboard-number {
            font-size: 3rem;
            font-weight: 800;
            color: var(--inacap-dark);
        }

        /* -------------------------
           BOTONES
        ------------------------- */

        .btn {
            border-radius: 8px;
            font-weight: 600;
            padding: 9px 18px;
            transition: all 0.2s ease-in-out;
        }

        .btn-inacap {
            background-color: var(--inacap-red);
            border-color: var(--inacap-red);
            color: var(--inacap-white);
        }

        .btn-inacap:hover {
            background-color: var(--inacap-red-dark);
            border-color: var(--inacap-red-dark);
            color: var(--inacap-white);
            transform: translateY(-1px);
        }

        .btn-dark-custom {
            background-color: var(--inacap-dark);
            border-color: var(--inacap-dark);
            color: var(--inacap-white);
        }

        .btn-dark-custom:hover {
            background-color: #000000;
            border-color: #000000;
            color: var(--inacap-white);
            transform: translateY(-1px);
        }

        .btn-outline-light:hover {
            color: var(--inacap-dark);
        }

        .btn-primary {
            background-color: var(--inacap-dark);
            border-color: var(--inacap-dark);
        }

        .btn-primary:hover {
            background-color: #000000;
            border-color: #000000;
        }

        .btn-success {
            background-color: var(--inacap-red);
            border-color: var(--inacap-red);
        }

        .btn-success:hover {
            background-color: var(--inacap-red-dark);
            border-color: var(--inacap-red-dark);
        }

        /* -------------------------
           TABLAS
        ------------------------- */

        .table {
            margin-bottom: 0;
            vertical-align: middle;
        }

        .table thead th {
            background-color: var(--inacap-dark);
            color: var(--inacap-white);
            border: none;
            padding-top: 14px;
            padding-bottom: 14px;
            font-size: 0.92rem;
        }

        .table tbody td {
            padding-top: 13px;
            padding-bottom: 13px;
        }

        .table-hover tbody tr:hover {
            background-color: #fff4f3;
        }

        /* -------------------------
           FORMULARIOS
        ------------------------- */

        .form-label {
            color: var(--inacap-dark);
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            border: 1px solid #d1d5db;
            min-height: 44px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--inacap-red);
            box-shadow: 0 0 0 0.20rem rgba(226, 35, 26, 0.14);
        }

        /* -------------------------
           BADGES
        ------------------------- */

        .badge {
            padding: 7px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
        }

        .badge.bg-success {
            background-color: #198754 !important;
        }

        .badge.bg-warning {
            background-color: #ffc107 !important;
        }

        .badge.bg-secondary {
            background-color: #6c757d !important;
        }

        /* -------------------------
           MENSAJES DE ERROR
        ------------------------- */

        .errorlist {
            margin: 6px 0 0 0;
            padding-left: 18px;
            color: #b91c1c;
            font-size: 0.9rem;
        }

        /* -------------------------
           FOOTER
        ------------------------- */

        footer {
            margin-top: 60px;
            background-color: var(--inacap-dark);
            color: #d1d5db;
            border-top: 4px solid var(--inacap-red);
            padding: 24px 0;
            text-align: center;
            font-size: 0.9rem;
        }

        /* -------------------------
           RESPONSIVE
        ------------------------- */

        @media (max-width: 768px) {

            .navbar .container {
                flex-direction: column;
                gap: 12px;
            }

            .nav-actions {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .main-container {
                margin-top: 30px;
            }

            .dashboard-number {
                font-size: 2.4rem;
            }

            .table {
                font-size: 0.9rem;
            }
        }

    </style>
</head>


<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="{% url 'inicio' %}">
            ■ Sistema Bancario | INACAP
        </a>

        <div class="nav-actions">

            <a
                class="btn btn-outline-light"
                href="{% url 'inicio' %}">
                Inicio
            </a>

            <a
                class="btn btn-outline-light"
                href="{% url 'listar_cuentas' %}">
                Cuentas
            </a>

            <a
                class="btn btn-inacap"
                href="{% url 'crear_cuenta' %}">
                + Nueva cuenta
            </a>

        </div>

    </div>

</nav>


<main class="container main-container">

    {% block contenido %}

    {% endblock %}

</main>


<footer>

    <div class="container">

        <strong>Sistema de Gestión Bancaria</strong>

        <br>

        Proyecto académico desarrollado con Django + MySQL/MariaDB

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
