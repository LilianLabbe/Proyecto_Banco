<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Inicio de sesión | Sistema Bancario
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border-top: 5px solid #e60000;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #e60000;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #e60000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b80000;
        }

        .error {
            background: #ffe5e5;
            color: #a00000;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .registro {
            text-align: center;
            margin-top: 20px;
        }

        .registro a {
            color: #e60000;
            font-weight: bold;
            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">

        <h1>
            🏦 Sistema Bancario
        </h1>

        <p>
            INACAP
        </p>

    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}


        <label for="id_username">
            RUT
        </label>

        <input
            type="text"
            name="username"
            id="id_username"
            placeholder="12.345.678-5"
            maxlength="12"
            autocomplete="username"
            required
            autofocus
        >


        <label for="id_password">
            Contraseña
        </label>

        <input
            type="password"
            name="password"
            id="id_password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            Iniciar sesión
        </button>

    </form>


    <div class="registro">

        ¿Aún no tienes cuenta?

        <a href="{% url 'registro' %}">
            Registrarse
        </a>

    </div>


    <div class="footer">
        Sistema de Gestión Bancaria
    </div>

</div>

</body>
</html>
